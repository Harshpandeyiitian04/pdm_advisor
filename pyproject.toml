# This file describes the project so tools know its name, the Python version, and which libraries it needs.
[project]
# The project name.
name = "pdm-advisor"
# The version number.
version = "0.1.0"
# A one-line description of what the project is.
description = "Predictive maintenance API for NASA C-MAPSS engine data"
# The Python versions this project can run on.
requires-python = ">=3.11,<3.13"
# The libraries needed to install the project.
dependencies = [
	"fastapi>=0.110",
	"joblib>=1.3",
	"numpy>=1.26",
	"pandas>=2.1",
	"scikit-learn>=1.4",
	"xgboost-cpu>=2.1.1",
]

# This tells the hosting site which file starts the web service.
[tool.vercel]
entrypoint = "app.api:app"
